name: Secret scan

# This repository is public. Every push and pull request runs gitleaks over the
# whole history, so a key committed on a branch fails here before it reaches
# main. A finding means the value is already on GitHub: rotate it first, then
# remove it. Deleting the commit does not unpublish it.
#
# False positives go in .gitleaks.toml with a reason, never as an inline skip.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The CLI, not gitleaks-action: the action needs a paid licence for
      # repositories owned by an organisation.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose
